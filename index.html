<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriScan · Escáner</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:560px;margin:0 auto;padding:20px;background:#f3f8f6;color:#24332d}
    h1{color:#21865b} .card{background:white;padding:16px;border-radius:14px;margin:14px 0}
    button{border:0;border-radius:9px;padding:12px 16px;background:#21865b;color:white;font-weight:700;font-size:1rem}
    input{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd8d1;border-radius:8px}
    #reader{width:100%} #status{white-space:pre-wrap}
    .small{font-size:.9rem;color:#586b62}
  </style>
</head>
<body>
  <h1>NutriScan</h1>
  <p>Escaneá el código de barras de un producto para enviarlo a NutriScan.</p>
  <div class="card">
    <label for="projectUrl">URL del proyecto Supabase</label>
    <input id="projectUrl" value="https://kolocddanxcchyvpndpe.supabase.co">
    <label for="publicKey">Clave pública (sb_publishable_…)</label>
    <input id="publicKey" autocomplete="off" placeholder="Pegá tu clave pública acá">
    <button id="save">Conectar</button>
    <p id="status">Primero ingresá la clave pública y tocá Conectar.</p>
  </div>
  <div class="card">
    <div id="reader"></div>
    <button id="start" disabled>Activar cámara</button>
    <p class="small">Si la cámara no funciona, podés escribir el código manualmente.</p>
    <label for="manual">Código de barras</label>
    <input id="manual" inputmode="numeric" placeholder="Ej.: 7791234567890">
    <button id="send" disabled>Enviar código</button>
  </div>
<script>
let supabaseClient = null;
let scanner = null;
let lastSent = "";
const statusEl = document.getElementById("status");
function status(t){statusEl.textContent=t;}
function validCode(code){return /^[0-9]{8,14}$/.test(code);}
async function sendCode(raw){
  const code=String(raw||"").trim();
  if(!validCode(code)){status("Código inválido. Debe tener entre 8 y 14 números.");return;}
  if(!supabaseClient){status("Primero conectá Supabase.");return;}
  status("Enviando código "+code+"…");
  const {error}=await supabaseClient.from("codigos_barras").insert({codigo:code});
  if(error){status("No se pudo enviar el código: "+error.message);return;}
  document.getElementById("manual").value=code;
  status("Código "+code+" enviado. Revisá NutriScan en la computadora.");
}
document.getElementById("save").addEventListener("click",()=>{
  const url=document.getElementById("projectUrl").value.trim().replace(/\/+$/,"");
  const key=document.getElementById("publicKey").value.trim();
  if(!url.startsWith("https://")||!key.startsWith("sb_publishable_")){status("Revisá la URL y la clave pública. No uses una clave secreta.");return;}
  supabaseClient=window.supabase.createClient(url,key);
  document.getElementById("start").disabled=false;
  document.getElementById("send").disabled=false;
  status("Conexión configurada. Ya podés activar la cámara o enviar un código manual.");
});
document.getElementById("send").addEventListener("click",()=>sendCode(document.getElementById("manual").value));
document.getElementById("manual").addEventListener("keydown",e=>{if(e.key==="Enter")sendCode(e.target.value);});
document.getElementById("start").addEventListener("click",async()=>{
  if(!supabaseClient){status("Primero conectá Supabase.");return;}
  try{
    if(!scanner)scanner=new Html5Qrcode("reader");
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:140},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128]},
      async(decoded)=>{if(decoded!==lastSent){lastSent=decoded;await sendCode(decoded);setTimeout(()=>{lastSent="";},2500);}},
      ()=>{});
    status("Cámara activa. Enfocá el código de barras.");
    document.getElementById("start").disabled=true;
  }catch(e){status("No se pudo abrir la cámara. Permití el acceso a la cámara y comprobá que la página use HTTPS.\n"+e);}
});
</script>
</body>
</html>
